apiVersion: apps/v1
kind: Deployment

metadata:
  name: bms-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: bms

  template:
    metadata:
      labels:
        app: bms

    spec:
      containers:
        - name: bms-container
          image: itsurvey6/bms:latest
          ports:
            - containerPort: 80




